[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum"
version = "0.1.0"
description = "Python-based trading system with FastAPI and multiple strategy support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Momentum Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "kiteconnect>=5.0.1",
    "redis>=5.2.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "numpy>=1.26.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.0",
    "pytz>=2024.1",
    "APScheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

db = [
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/sushainu2204-alt/Momentum"
Repository = "https://github.com/sushainu2204-alt/Momentum"

[project.scripts]
momentum = "backend.main:app"

# ============================================================
# TOOL CONFIGURATIONS
# ============================================================

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "tests*"]

# ============================================================
# PYTEST CONFIGURATION
# ============================================================

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: Unit tests - fast, isolated, no external dependencies",
    "integration: Integration tests - may need database/APIs",
    "e2e: End-to-end tests - full system tests",
    "slow: Slow tests - skip with -m 'not slow'",
]

# ============================================================
# COVERAGE CONFIGURATION
# ============================================================

[tool.coverage.run]
source = ["backend"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
show_missing = true
precision = 2
fail_under = 70

[tool.coverage.html]
directory = "htmlcov"

# ============================================================
# RUFF (LINTING & FORMATTING)
# ============================================================

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "*.pyc",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without strict
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# MYPY (TYPE CHECKING)
# ============================================================

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    "non-prod/",
]
